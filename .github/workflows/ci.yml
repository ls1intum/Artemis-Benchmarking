name: Continuous Integration

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Server Tests
        run: ./gradlew test -x webapp

      - name: Check Client Formatting
        run: pnpm run prettier:check

      - name: Lint Client
        run: pnpm run lint
# Temporarily disabled client tests until we switch to Vitest
#      - name: Run Client Tests
#        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    # Only run the (expensive) full-stack e2e suite once the fast checks pass.
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Build application image
        run: docker build -t ls1tum/artemis-benchmarking:latest .

      - name: Start application stack (server + MySQL)
        run: docker compose up -d --wait --wait-timeout 600

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Tests
        run: pnpm run e2e

      - name: Show server logs on failure
        if: failure()
        run: docker compose logs benchmarking

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop application stack
        if: always()
        run: docker compose down -v
