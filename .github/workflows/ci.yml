name: Continuous Integration

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test step used to run for up to six hours (the GitHub default); the whole job normally takes ~3 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The watchdog writes a thread dump of every JVM if a step stops printing output, so a hang explains itself
      # instead of just timing out. The dumps are uploaded below.
      - name: Run Server Tests
        timeout-minutes: 15
        run: ./supporting_scripts/ci-run-with-watchdog.sh unit-tests ./gradlew test -x webapp

      # Integration tests (*IT) boot the full Spring context against a PostgreSQL Testcontainer.
      # They are excluded from the `test` task, so run them explicitly (ubuntu-latest provides Docker).
      - name: Run Integration Tests
        timeout-minutes: 15
        run: ./supporting_scripts/ci-run-with-watchdog.sh integration-tests ./gradlew integrationTest -x webapp

      - name: Check Client Formatting
        run: pnpm run prettier:check

      - name: Lint Client
        run: pnpm run lint

      - name: Run Client Tests
        run: pnpm run prebuild && pnpm exec ng test --no-watch

      - name: Upload thread dumps and test logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7
        with:
          name: thread-dumps
          path: build/thread-dumps/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    # Only run the full-stack e2e suite once the fast checks pass.
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Runs the server (gradlew bootRun) and client (pnpm start) on the runner
      # against PostgreSQL in a container, then runs Playwright. Same path as the
      # local fast runner; avoids the docker-image client-packaging issue.
      - name: Run E2E tests
        run: ./run-e2e-tests-local-fast.sh

      - name: Dump server/client logs on failure
        if: failure()
        run: tail -n 200 .e2e-local/server.log .e2e-local/client.log 2>/dev/null || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The production image is otherwise only built after the merge to main (deploy.yml). A change that breaks it, for
  # example a Node.js version whose binary needs a system library the build image lacks, would then fail the deployment
  # instead of the pull request. This builds the same image without pushing it.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: artemis-benchmarking:ci
