services:
  nginx:
    image: nginx:1.31.6-alpine-slim
    ports:
      - '80:80'
      - '443:443'
    expose:
      - '80'
      - '443'
    healthcheck:
      test: service nginx status || exit 1
      start_period: 10s
    restart: always
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/artemis-performance-test0.artemis.cit.tum.de80:/etc/nginx/sites-enabled/artemis-performance-test0.artemis.cit.tum.de80:ro
      - ./config/nginx/artemis-performance-test0.artemis.cit.tum.de443:/etc/nginx/sites-enabled/artemis-performance-test0.artemis.cit.tum.de443:ro
      # Mount the whole client directory (read-only): the live/ entries are symlinks into archive/, and the file
      # names contain colons, which `source:target` short syntax cannot express.
      - type: bind
        source: /etc/pira-client
        target: /etc/pira-client
        read_only: true
