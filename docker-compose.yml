services:
  benchmarking:
    image: ls1tum/artemis-benchmarking:latest
    env_file:
      - config/benchmarking.env
    environment:
      # The image entrypoint is a bare `java -jar`, so without this the JVM takes its default maximum
      # heap of 25% of available memory: 1.9 GB on an 8 GB host, leaving three quarters of the machine
      # unused. A 500-student simulation exhausted that and died with OutOfMemoryError, including one
      # thrown from the http-nio acceptor thread, which left the app accepting connections but never
      # answering: unresponsive at 2% CPU rather than visibly crashed.
      # A percentage rather than a fixed -Xmx so the setting still makes sense if the host is resized.
      # The remainder is not spare: simulated students clone git repositories to disk, so the page cache
      # earns its keep, and Postgres runs alongside on the same host.
      # The heap dump makes a future exhaustion diagnosable instead of guesswork.
      JDK_JAVA_OPTIONS: >-
        -XX:MaxRAMPercentage=65
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp
    tmpfs:
      # Simulated students clone into /repos, one working copy each. Those clones are small (a thousand
      # students came to 321 MB) but they are written as a great many tiny files, and that random I/O was
      # keeping the host disk 82% busy at only 5.3 MB/s during a 1000-student run. Virtual threads raise how
      # many students can be in flight, but file I/O still occupies its carrier thread for the duration, so
      # a slow working directory would simply become the new ceiling. RAM has neither the seek cost nor the
      # IOPS limit.
      # tmpfs only consumes what is actually stored, so the size is a cap and not a reservation. It does
      # compete with the JVM heap configured above, so check free memory before pushing concurrency far
      # past a thousand students on a host this size.
      - /repos:size=1g,mode=1777
    ports:
      - '127.0.0.1:8080:8080'
    expose:
      - '8080'
    healthcheck:
      test: wget -nv -t1 --spider http://localhost:8080/management/health || exit 1
      start_period: 600s
      interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:18-alpine
    volumes:
      - artemis-postgres-data:/var/lib/postgresql
    env_file:
      - config/postgres.env
    expose:
      - '5432'
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 300s
    restart: always

volumes:
  artemis-postgres-data:
    name: artemis-postgres-data
