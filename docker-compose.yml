services:
  benchmarking:
    image: ls1tum/artemis-benchmarking:latest
    env_file:
      - config/benchmarking.env
    ports:
      - '127.0.0.1:8080:8080'
    expose:
      - '8080'
    healthcheck:
      test: wget -nv -t1 --spider http://localhost:8080/management/health || exit 1
      start_period: 600s
      interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:18-alpine
    volumes:
      - artemis-postgres-data:/var/lib/postgresql
    env_file:
      - config/postgres.env
    expose:
      - '5432'
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 300s
    restart: always

volumes:
  artemis-postgres-data:
    name: artemis-postgres-data
