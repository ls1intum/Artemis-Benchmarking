rootProject.name=artemis-benchmarking
profile=dev

# Build properties
node_version=26.13.1
pnpm_version=12.21.0

# Dependency versions
# Held at 4.1.x on purpose: Spring Framework 7.1.0 (Spring Boot 4.2.0) can deadlock between its bean-type cache and
# the singleton lock (spring-projects/spring-framework#37516, fix in #37517, not released yet). It hung about every
# second CI run here. Spring Framework 7.0.x (Spring Boot 4.1.x) is not affected and has no known vulnerabilities
# (Trivy scan). Move to Spring Boot 4.2.x once Spring Framework 7.1.1 contains the fix, and remove the
# allowedVersions rule for Spring Boot in renovate.json.
springBootVersion=4.1.3
commonsLangVersion=3.22.0
mapstructVersion=1.6.3
archunitJunit5Version=1.5.1
junitVersion=6.1.3
jacksonDatabindNullableVersion=0.2.13
postgresqlVersion=42.7.14
testcontainersVersion=2.0.5
jgitVersion=7.8.1.202611041320-r
sshdVersion=2.20.1
webauthn4jVersion=0.32.0.RELEASE

jaxbRuntimeVersion=4.0.9

# gradle plugin version
jibPluginVersion=3.5.4
gitPropertiesPluginVersion=4.0.1
gradleNodePluginVersion=7.1.0
sonarqubePluginVersion=7.6.0.18749
spotlessPluginVersion=8.11.0
openapiPluginVersion=7.27.0
checkstyleVersion=14.4.0
modernizerPluginVersion=1.15.0

liquibaseTaskPrefix=liquibase
liquibasePluginVersion=3.1.1
liquibaseVersion=5.0.4

org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.country=US -Duser.language=en \
  --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-modules java.se \
  --add-exports java.base/jdk.internal.ref=ALL-UNNAMED \
  --add-opens java.base/java.lang=ALL-UNNAMED \
  --add-opens java.base/sun.nio.ch=ALL-UNNAMED \
  --add-opens java.management/sun.management=ALL-UNNAMED \
  --add-opens jdk.management/com.sun.management.internal=ALL-UNNAMED
