dependencies {
    implementation "org.postgresql:postgresql:${postgresqlVersion}"
    testImplementation "org.testcontainers:testcontainers-postgresql:${testcontainersVersion}"
}

ext {
    springProfiles = "dev" + springProfiles
}

springBoot {
    buildInfo {
        excludes = ["time"]
    }
}

bootRun {
    args = ["--spring.profiles.active=${springProfiles}"]
}

tasks.register("webapp", PnpmTask) {
    inputs.property("appVersion", project.version)
    inputs.files("pnpm-lock.yaml")
        .withPropertyName("pnpm-lock")
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files("build.gradle")
        .withPropertyName("build.gradle")
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files("angular.json")
        .withPropertyName("angular.json")
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files("tsconfig.json", "tsconfig.app.json")
        .withPropertyName("tsconfig")
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir("src/main/webapp/")
        .withPropertyName("webapp-source-dir")
        .withPathSensitivity(PathSensitivity.RELATIVE)
    // Build into a dedicated directory so it never overlaps with processResources' output
    // dir (build/resources/main); otherwise the static webapp is wiped on clean CI builds.
    outputs.dir("build/webapp")
        .withPropertyName("webapp-build-dir")

    dependsOn pnpmInstall

    args = ["run", "webapp:build"]
    environment = [APP_VERSION: project.version]
}

processResources {
    dependsOn webapp
    // Copy the compiled webapp in as a Spring Boot static resource.
    from("build/webapp") {
        into "static"
    }
    inputs.property("version", version)
    inputs.property("springProfiles", springProfiles)
    filesMatching("**/application.yml") {
        filter {
            it.replace("#project.version#", version)
        }
        filter {
            it.replace("#spring.profiles.active#", springProfiles)
        }
    }
}

bootJar.dependsOn processResources
