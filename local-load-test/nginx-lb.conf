# Plain-HTTP load balancer over the two Artemis core nodes.
# Handles REST/management, LocalVC git (large bodies, unbuffered) and the STOMP websocket
# (connection upgrade + long timeouts). The websocket TCP connection pins to one node for its
# lifetime; cross-node delivery is handled by the ActiveMQ broker relay.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream artemis_core {
    least_conn;
    server artemis-app-node-1:8080 max_fails=3 fail_timeout=30s;
    server artemis-app-node-2:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    # Allow large git pushes and stream them through unbuffered.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://artemis_core;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_connect_timeout 75s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
