# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - metrics
          - openapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - caches
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    metrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true

spring:
  application:
    name: artemis-benchmarking
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by gradle when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: #spring.profiles.active#
    group:
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  liquibase:
    change-log: classpath:config/liquibase/master.xml
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: false
    allow-circular-references: false
    lazy-initialization: true
  mvc:
    problemdetails:
      enabled: true
  task:
    execution:
      thread-name-prefix: artemis-benchmarking-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: artemis-benchmarking-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

benchmarking:
  client-app:
    name: 'artemisBenchmarkingApp'
  simulation:
    # How closely simulated students imitate a real browser. A traced exam session spent 547 of its 632 requests and
    # 20 of its 20.5 MB on the client bundle, so leaving these off measures the REST mix but almost none of the load.
    static-resources:
      # Note the cost on this side too: every cold student downloads about 20 MB, so a 500-user run pulls roughly 10 GB
      # through the tool host. That is the load a real exam cohort causes, but the machine running the benchmark has to
      # be able to sink it.
      enabled: true
      # Share of students arriving with an empty browser cache, who therefore download the whole bundle. Artemis serves
      # content-hashed filenames with a one-year lifetime, so the rest request almost nothing.
      cold-cache-percentage: 100
      # Ceiling on how many files one bundle discovery may collect.
      max-assets: 2000
      # Top-level routes a student cannot open, left out of the bundle a student downloads. Angular names its lazily
      # loaded routes after their source file, so these survive an Artemis rebuild even though the hashes do not.
      # Worth stating explicitly: exam-management is the single largest thing Artemis ships (296 files, 3.69 MB on
      # staging1) and it is an instructor console. Leave this empty to fall back to the built-in list; the code never
      # treats empty as "exclude nothing".
      non-student-routes: exam-management,course-management,admin.routes,lti.,sharing.,data-export,course-request,feature-overview,exam-rooms
      # Parallel downloads per student, mirroring a browser's per-origin connection limit.
      fetch-concurrency: 6
      # How many students download the bundle at once. Zero means the whole cohort, which is what an exam start is:
      # every browser asking together. The max-concurrency below governs the rest of the run instead, because that is
      # about work the tool host does — REST calls, clones, pushes — while this phase only waits on sockets.
      #
      # Holding this phase to max-concurrency measured the tool rather than the server: at 200 students times six
      # parallel fetches a 2000-student run sat at ~1,100 requests in flight and never rose, whatever Artemis did.
      # Set a number here if the tool host cannot sink the bandwidth, which is its own kind of measurement error.
      concurrency: 0
      # Roughly how many files one navigation pulls in. Angular splits a view across several chunks, so opening one view
      # costs far more than one chunk. Two browser traces of the same exam both put a session at 538 distinct static
      # files and 20.4 MB, measured from the load balancer's access log. The simulated journey navigates eight times and
      # its shell is 141 files, leaving 397 for those eight; a navigation takes whole bundles and so overshoots its
      # budget by about a quarter. The file names are always discovered from the running server, so only this ratio may
      # ever need adjusting for a future Artemis.
      assets-per-navigation: 39
    # How many times opening a view asks the server for the time. Several client components ask on initialisation, so
    # the calls arrive in a burst per view rather than on a timer: the traces show 31 per session, four to seven on each
    # page load and none at all while the student sits idle.
    server-time-calls-per-navigation: 3
    # Window across which students enter each phase, instead of all on the same tick. Every phase is a barrier, so
    # without this each one starts with the cohort in lockstep and its first call arrives as a single spike — a
    # 2000-user run put exactly 2000 /api/public/time requests into one second. Costs at most this much per phase.
    arrival-spread-millis: 15000
    # Share of exercises a student opens but leaves unanswered. Programming exercises are never skipped; their clone
    # and push are the most expensive path a run measures and dropping them at random would move the numbers.
    exercise-skip-percentage: 10
    # How long a simulated student pauses between two actions. A student in an exam reads the question, thinks and
    # types; they do not fire a request every couple of seconds for two hours. The previous 2-4 s made a run heavier
    # than any real cohort and compressed the exam into a burst. A waiting student gives up its concurrency slot, so
    # raising this paces the run rather than throttling it.
    # Drawn log-normally with this range's mean, not uniformly: real dwell times have a long tail, and a uniform draw
    # barely desynchronises a cohort that was released together.
    think-time:
      min-millis: 5000
      max-millis: 10000
    # Connections the simulated cohort may hold open at once. Reactor-netty's default is max(cores, 8) * 2 — sixteen
    # on an eight-core host — shared by every student, which is nothing like a cohort and quietly caps a run before
    # the server is anywhere near its limit. A request that cannot get a connection waits rather than failing, so the
    # run reports the server slowing down instead of the tool refusing to ask.
    connection-pool:
      max-connections: 2500
    # Which HTTP protocol the simulated users speak.
    #   auto - negotiate HTTP/2 with a HTTP/1.1 fallback over TLS, stay on HTTP/1.1 in plaintext. What a browser does.
    #   h1   - force HTTP/1.1 everywhere, the behaviour before this setting existed.
    #   h3   - force HTTP/3 over QUIC, for servers that advertise it (staging1 sends alt-svc: h3=":443"). There is no
    #          fallback: a server without HTTP/3 will fail the run, and the QUIC natives only ship for linux-x86_64,
    #          linux-aarch_64 and osx-aarch_64.
    http-protocol: auto
    # How often the open submission is written back while a student works on an exercise. The Artemis exam client saves
    # every 30 seconds while there are unsaved changes; four saves matches a two-minute stay on one exercise.
    auto-saves-per-exercise: 4
  # By default CORS is disabled. Uncomment to enable.
  # cors:
  #   allowed-origins: "http://localhost:8100,http://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count,X-${benchmarking.client-app.name}-alert,X-${benchmarking.client-app.name}-error,X-${benchmarking.client-app.name}-params"
  #   allow-credentials: true
  #   max-age: 1800
  mail:
    from: artemis-benchmarking@localhost
    base-url: http://127.0.0.1:8080
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Artemis Benchmarking API
    description: Artemis Benchmarking API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"

