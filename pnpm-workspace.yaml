nodeLinker: hoisted

# Some transitive deps (e.g. @swimlane/ngx-charts) declare older Angular peer
# ranges than we ship; we satisfy them via peerDependencyRules + overrides below
# and don't want install to fail on the mismatch.
strictPeerDependencies: false

# Packages whose install/postinstall scripts are allowed to run. Without this,
# pnpm 11 silently skips native-binary builds for these deps. Maintained by
# `pnpm approve-builds`.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Relax @swimlane/ngx-charts' Angular peer-dep range so Angular 22 satisfies it.
# (ngx-charts declares 19.x || 20.x || 21.x, but works fine on 22.x.)
peerDependencyRules:
  allowedVersions:
    '@swimlane/ngx-charts>@angular/animations': '22'
    '@swimlane/ngx-charts>@angular/cdk': '22'
    '@swimlane/ngx-charts>@angular/common': '22'
    '@swimlane/ngx-charts>@angular/core': '22'
    '@swimlane/ngx-charts>@angular/forms': '22'
    '@swimlane/ngx-charts>@angular/platform-browser': '22'
    '@swimlane/ngx-charts>@angular/platform-browser-dynamic': '22'

# Transitive dependency overrides for known vulnerable or otherwise undesirable
# versions. Keep this list pruned — overrides outlive the security fix that
# motivated them and can block legitimate upstream upgrades.
overrides:
  '@swimlane/ngx-charts>@angular/animations': ^22.0.0
  '@swimlane/ngx-charts>@angular/cdk': ^22.0.0
  '@swimlane/ngx-charts>@angular/common': ^22.0.0
  '@swimlane/ngx-charts>@angular/compiler': ^22.0.0
  '@swimlane/ngx-charts>@angular/core': ^22.0.0
  '@swimlane/ngx-charts>@angular/forms': ^22.0.0
  '@swimlane/ngx-charts>@angular/platform-browser': ^22.0.0
  '@swimlane/ngx-charts>@angular/platform-browser-dynamic': ^22.0.0
  '@swimlane/ngx-charts>@angular/router': ^22.0.0
  '@swimlane/ngx-charts>rxjs': ^7.8.2
  braces: 3.0.3
  cookie: 1.1.1
  debug: 4.4.3
  esbuild: 0.28.1
  express: 5.2.1
  globals: 17.11.0
  lodash: 4.18.1
  lodash-es: 4.18.1
  postcss: 8.5.26
  punycode: 2.3.1
  rimraf: 6.1.3
  tough-cookie: 6.0.1
  webpack: 5.107.2
  webpack-dev-middleware: 8.0.3
  webpack-dev-server: 5.2.5
  word-wrap: 1.2.5
  ws: 8.21.0
  yargs-parser: 22.0.0
