nodeLinker: hoisted

# Transitive deps occasionally declare peer ranges that our versions do not satisfy
# (for example an Angular range that lags a release behind). Warn instead of failing
# the install; add an entry to `overrides` below if a mismatch actually breaks something.
strictPeerDependencies: false

# Packages whose install/postinstall scripts are allowed to run. Without this,
# pnpm 11 silently skips native-binary builds for these deps. Maintained by
# `pnpm approve-builds`.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Transitive dependency overrides for known vulnerable or otherwise undesirable
# versions. Keep this list pruned — overrides outlive the security fix that
# motivated them and can block legitimate upstream upgrades.
overrides:
  braces: 3.0.3
  cookie: 2.0.1
  debug: 4.4.3
  esbuild: 0.28.2
  express: 5.2.1
  globals: 17.11.0
  lodash: 4.18.1
  lodash-es: 4.18.1
  postcss: 8.5.26
  punycode: 2.3.1
  rimraf: 6.1.3
  tough-cookie: 6.0.2
  webpack: 5.109.2
  webpack-dev-middleware: 8.1.1
  webpack-dev-server: 5.2.6
  word-wrap: 1.2.5
  ws: 8.21.3
  yargs-parser: 22.0.0
